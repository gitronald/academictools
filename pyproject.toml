[project]
name = "academictools"
version = "0.8.4a0"
description = "Tools for academic data analysis: data IO, dataframe summaries, statistical tests, and paper-ready figures."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Ronald E. Robertson", email = "rer@acm.org" }
]
# Tight minor-pinned windows: scientific packages can change numeric results
# across minor releases, so each is bounded to its current minor (patches allowed,
# minor/major bumps blocked).
dependencies = [
  "pandas>=3.1.0,<3.2.0",
  "numpy>=2.5.0,<2.6.0",
  "matplotlib>=3.11.0,<3.12.0",
  "seaborn>=0.13.2,<0.14.0",
  "ujson>=6.0.0,<6.1.0",
  "duckdb>=1.5.4,<1.6.0",
  "scipy>=1.18.0,<1.19.0",
  "statsmodels>=0.15.0,<0.16.0",
  "ipython>=9.17.1,<9.18.0",
  "polars>=2.1.0,<2.2.0",
  "pyarrow>=26.0.0,<26.1.0",
]

[project.urls]
homepage = "https://github.com/gitronald/academictools"
repository = "https://github.com/gitronald/academictools"
documentation = "https://github.com/gitronald/academictools#readme"
"Bug Tracker" = "https://github.com/gitronald/academictools/issues"

[project.scripts]
qr = "tools.utils.qr:main"

# repotemplates release stamp, set by init.sh and install-template; inert to consumers.
[tool.repotemplates]
version = "0.15.0"

[project.optional-dependencies]
qr = ["qrcode[pil]>=8.2,<8.3"]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<9.3.0",
  "pytest-cov>=7.1.0,<7.2.0",
  # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
  "ruff>=0.17.1,<0.18.0",
  "qrcode[pil]>=8.2,<8.3",
  "pyrefly>=1.4.0,<1.5.0",
  "pre-commit>=4.7.0,<4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/tools",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
# The distribution is `academictools`; the import package stays `tools`.
packages = ["tools"]

[tool.ruff]
target-version = "py314"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.14"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["tools"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
